# Alembic settings for running migrations by hand, e.g.:
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head
# The API applies pending migrations by itself on startup (see db.init_db).
[alembic]
script_location = investtrack/migrations
# Kept short and sortable: 0001_baseline.py, 0002_users.py...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
