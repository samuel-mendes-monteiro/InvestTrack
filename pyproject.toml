[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investtrack"
version = "0.1.0"
description = "Personal investment portfolio tracker for the Brazilian stock market (B3)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["investtrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
