[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investtrack"
version = "0.5.0"
description = "Personal investment portfolio tracker for the Brazilian stock market (B3)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# The frontend talks to the API over HTTP only, so the backend doesn't need these.
ui = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["investtrack*"]  # also the migrations, which have no __init__.py

[tool.setuptools.package-data]
investtrack = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["frontend"]  # frontend modules are imported like Streamlit does
filterwarnings = [
    # Starlette's TestClient now suggests the "httpx2" package; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # A database connection left open is a bug: fail the test that leaks it.
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and pyflakes, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["investtrack"]
omit = ["investtrack/demo.py", "investtrack/migrations/*"]  # migrations: test_migrations.py

[tool.ruff.lint.isort]
known-first-party = ["investtrack", "api_client", "formatting"]
