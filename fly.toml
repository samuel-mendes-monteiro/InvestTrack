# Fly.io: one machine in São Paulo running the Docker image, with the SQLite
# database on a persistent volume. App names are global on Fly: change `app`
# if this one is taken.
app = "investtrack"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: the first history download takes about a minute in the
  # background, and a machine that sleeps would cut it off (and make the
  # first visit wait for it to boot).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# The database lives here and survives deploys. One volume means one
# machine: SQLite is a file, and two machines can't share it.
[[mounts]]
  source = "investtrack_data"
  destination = "/data"

[[vm]]
  # Reading a month of COTAHIST (tens of MB) needs more than 256 MB.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
